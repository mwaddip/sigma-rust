[package]
name = "blitzen"
version = "0.1.0"
edition = "2021"
description = "Blitzen: sigma-rust's runner for SANTA, the Ergo consensus conformance suite (eval, wire, transaction and NiPoPoW tiers)"

[dependencies]
# The crates of this repository, by path: the runner is built against the checkout it sits
# in. Cargo resolves `path` deps relative to this manifest (not the CWD), so the build runs
# from any working directory.
ergotree-ir = { path = "../ergotree-ir" }
# The `arbitrary` feature carries `eval::test_util::try_eval_with_deserialize`, the public
# entry that evaluates a root of any type, and (through ergotree-ir) the lenient tree parse.
ergotree-interpreter = { path = "../ergotree-interpreter", features = ["arbitrary"] }
ergo-chain-types = { path = "../ergo-chain-types" }
# Signed `Transaction` (SigmaSerializable) lives here — the serializer for the wire
# Transaction round-trip. Heavier than the IR crates (the footprint cost of tx support).
ergo-lib = { path = "../ergo-lib" }
# ScorexSerializable (Header parses via scorex_parse_bytes, not SigmaSerializable).
sigma-ser = { path = "../sigma-ser" }
# The NiPoPoW tier (interlinks + prove).
ergo-nipopow = { path = "../ergo-nipopow" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The same `ergo_avltree_rust` the repository's own manifest patches in (its verifier returns an
# error where the crates.io release panics): a patch applies only in the workspace being built,
# and this is one of its own.
[patch.crates-io]
ergo_avltree_rust = { git = "https://github.com/mwaddip/ergo_avltree_rust.git", rev = "b95579006eb5629d154293c449210053afbf49a4" }

# A workspace of its own: the runner is not a member of the repository's workspace, so the
# repository's builds, lints and tests do not build it, and it keeps its own `Cargo.lock`.
[workspace]
